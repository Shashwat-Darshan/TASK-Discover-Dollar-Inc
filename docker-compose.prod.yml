services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: mean-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - mean-network

  backend:
    image: ${BACKEND_IMAGE}
    container_name: mean-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/dd_db}
    depends_on:
      - mongodb
    networks:
      - mean-network

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: mean-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mean-network

volumes:
  mongo_data:

networks:
  mean-network:
    driver: bridge
