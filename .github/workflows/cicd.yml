name: MEAN App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-to-vm:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy latest images to Ubuntu VM
        if: secrets.VM_HOST != ''  # Only run if VM is configured
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.VM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/mean-devops-assignment"; fi

            sudo mkdir -p "$APP_DIR"
            sudo chown "$(whoami)":"$(whoami)" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            cat > .env <<EOF
            MONGO_IMAGE=mongo:7
            MONGODB_URL=mongodb://mongodb:27017/dd_db
            BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:latest
            FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:latest
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Build Success (without VM deployment)
        if: secrets.VM_HOST == ''
        run: |
          echo "✓ Docker images built and pushed successfully!"
          echo "✓ VM deployment skipped (no VM_HOST secret configured)"
